name: Release tagged revision

# Packs every library and pushes them all; versions already on nuget.org are skipped.  To release
# a package, bump its VersionPrefix and push any version tag.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    # Libraries only: the solution also holds demos and a C++ project dotnet cannot build.  One
    # step each, so any failed pack stops the job before anything is pushed.
    - name: Build Itp.HidBarcodeScanner
      run: dotnet pack Itp.HidBarcodeScanner -c Release -p PackageOutputPath=${{github.workspace}}/dist
    - name: Build Itp.WpfScanners
      run: dotnet pack Itp.WpfScannerScopes -c Release -p PackageOutputPath=${{github.workspace}}/dist
    - name: Build Itp.HidCallControl
      run: dotnet pack Itp.HidCallControl -c Release -p PackageOutputPath=${{github.workspace}}/dist
    - name: Build Itp.WpfCamera
      run: dotnet pack Itp.WpfCamera -c Release -p PackageOutputPath=${{github.workspace}}/dist
    - name: NugetPush
      run: dotnet nuget push -s https://api.nuget.org/v3/index.json --api-key ${{secrets.MG_NUGET_SECRET}} --skip-duplicate "${{github.workspace}}/dist/**/*.nupkg"
